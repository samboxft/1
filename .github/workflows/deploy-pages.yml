name: Deploy SketchHabit to GitHub Pages

on:
  push:
    branches:
      - cursor/drawing-habit-app-b47f
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sketchhabit/package-lock.json

      - name: Install dependencies
        working-directory: sketchhabit
        run: npm ci

      - name: Build static export
        working-directory: sketchhabit
        env:
          NEXT_STATIC_EXPORT: "1"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sketchhabit/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
